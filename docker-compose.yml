# Local development and CI stack. `docker compose up -d postgres s3 mailpit` is enough for `npm run dev`;
# `docker compose --profile app up --build` also runs migrations, the web app and the worker in containers.
name: travel-saas

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: travel
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d travel"]
      interval: 2s
      retries: 30

  # S3-compatible object storage for development (MinIO stopped publishing images in 2025).
  s3:
    image: chrislusf/seaweedfs:4.48
    # Development-only credentials (dev/dev), matching .env.example.
    command: server -s3 -s3.config=/etc/seaweedfs/s3.json -dir=/data -master.volumeSizeLimitMB=256
    ports: ["8333:8333"]
    volumes:
      - s3data:/data
      - ./docker/s3.json:/etc/seaweedfs/s3.json:ro

  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["1025:1025", "8025:8025"]

  migrate:
    profiles: [app]
    build: { context: ., target: migrate }
    environment:
      DATABASE_URL: postgresql://app:app@postgres:5432/travel
    depends_on:
      postgres: { condition: service_healthy }

  app:
    profiles: [app]
    build: { context: ., target: runtime }
    env_file: .env.docker
    ports: ["3000:3000"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  worker:
    profiles: [app]
    build: { context: ., target: runtime }
    command: ["node", "worker.mjs"]
    env_file: .env.docker
    depends_on:
      migrate: { condition: service_completed_successfully }

volumes:
  pgdata:
  s3data:
